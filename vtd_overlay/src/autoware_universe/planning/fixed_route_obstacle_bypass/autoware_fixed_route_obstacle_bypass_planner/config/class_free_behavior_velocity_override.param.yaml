/**:
  ros__parameters:
    # These modules remain loaded for route/regulatory handling, but UNKNOWN
    # occupancy conflicts are owned exclusively by the fixed-route planner. CAR and PEDESTRIAN checks stay enabled.
    crosswalk:
      object_filtering:
        target_object:
          unknown: false
          bicycle: false
          motorcycle: false
          pedestrian: true
    intersection:
      stuck_vehicle:
        target_type:
          car: true
          bus: false
          truck: false
          trailer: false
          motorcycle: false
          bicycle: false
          unknown: false
      yield_stuck:
        target_type:
          car: true
          bus: false
          truck: false
          trailer: false
          motorcycle: false
          bicycle: false
          unknown: false
      collision_detection:
        target_type:
          car: true
          bus: false
          truck: false
          trailer: false
          motorcycle: false
          bicycle: false
          unknown: false
    roundabout:
      collision_detection:
        target_type:
          car: true
          bus: false
          truck: false
          trailer: false
          motorcycle: false
          bicycle: false
          unknown: false
    detection_area:
      target_filtering:
        pointcloud: false
        unknown: false
