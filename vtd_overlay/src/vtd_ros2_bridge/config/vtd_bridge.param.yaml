/**:
  ros__parameters:
    use_sim_time: true

    # 인터페이스 API.xlsx: one headerless, bidirectional DATA/CONTROL socket.
    control:
      host: 127.0.0.1
      port: 9910
      reconnect_delay_ms: 1000
      # Fixed wall-time TX cadence; each tick sends only the newest command.
      send_period_ms: 40

    # Set -1 to select by ego_name, or to auto-select the first PLAYER when ego_name is empty.
    ego_player_id: -1
    ego_name: Ego
    camera_id: -1
    lidar_emitter_id: -1

    map_frame: map
    base_frame: base_link
    lidar_frame: lidar_link
    camera_frame: camera_optical_link

    # Rigid 2-D transform: p_autoware = R(yaw) * p_vtd + translation.
    # The fixed OpenDRIVE/Lanelet2 pair should normally use all zero values.
    map_offset:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # Lanelet2 paths are 2-D (z=0). Publish VTD ego/object poses on the same plane.
    # Object height is still retained in Shape and in the synthetic obstacle pointcloud.
    flatten_z: true

    publish_clock: true
    clock:
      # Keep ROS/TF time monotonic across VTD Stop -> Start and bridge restarts.
      anchor_to_system_time: true
      reset_threshold_sec: 0.5
      restart_gap_sec: 0.05
    publish_map_to_base_tf: true
    flip_image_vertical: false

    traffic_light:
      # id_map_file defaults to config/hlvtd_traffic_light_id_map.csv in this package.
      # 9910 uses Host approach IDs, not individual RDB/OpenDRIVE lamp IDs.
      # Must remain false: raw IDs cannot be substituted for map regulatory-element IDs.
      publish_unmapped_ids: false

    control_timeout_sec: 0.5
    watchdog_deceleration: -2.0
    report_autonomous_mode: true
    # Report the accepted Autoware gear immediately while VTD applies the RDB command.
    report_commanded_gear: true
    # Keep status stable while the physical VTD indicator lamps blink on/off.
    report_commanded_lights: true
    default_autoware_gear: 2  # autoware_vehicle_msgs/GearCommand.DRIVE
    publish_empty_occupancy_grid: true
    publish_empty_obstacle_pointcloud: true
    perception:
      # Publish only sensor-local objects to Autoware perception. /vtd/objects remains unfiltered.
      object_max_range_m: 200.0
      # Simulator heuristic: all three minima must pass; larger vehicles also use CAR.
      # Non-matching objects use the pedestrian templates below or remain UNKNOWN.
      vehicle_geometry:
        enabled: true
        min_length_m: 2.514
        min_width_m: 1.480
        min_height_m: 1.302
        # Approximate rear-axle -> bbox center along the OBJECT heading, not ego yaw.
        forward_offset_length_ratio: 0.3333333333333333
      # Match each complete [length, width, height] triple independently (metres).
      # These four sizes were observed live and confirmed to be people by the scenario owner.
      # PEDESTRIAN takes priority over CAR and never receives the vehicle position offset.
      pedestrian_classification:
        enabled: true
        dimension_tolerance_m: 0.01
        dimensions_lwh_m: [0.55, 0.63, 1.625, 0.50, 0.60, 1.425, 0.60, 0.70, 1.80, 0.50, 0.60, 1.35]
    occupancy_grid:
      resolution: 0.5
      width: 400
      height: 400
      publish_period_sec: 0.5
    limits:
      min_acceleration: -6.0
      max_acceleration: 3.0
      max_steering_angle: 0.7

    # Disabled: the supplied interface exposes LiDAR only through UDP 9912.
    shm:
      key: 0
      check_mask: 4
      optix_return_index: 0
      optix_camera_id: -1

    camera:
      fallback_fx: 0.0
      fallback_fy: 0.0
      fallback_cx: 0.0
      fallback_cy: 0.0

    topics:
      odometry: /localization/kinematic_state
      acceleration: /localization/acceleration
      localization_initialization_state: /localization/initialization_state
      occupancy_grid: /perception/occupancy_grid_map/map
      obstacle_pointcloud: /perception/obstacle_segmentation/pointcloud
      pointcloud: /sensing/lidar/top/pointcloud_raw
      image: /sensing/camera/camera0/image_raw
      camera_info: /sensing/camera/camera0/camera_info
      ego_state: /vtd/ego_state
      objects: /vtd/objects
      traffic_lights: /vtd/traffic_lights
      autoware_traffic_lights: /simulator/input/traffic_signals
      road_speed_limit_source: /planning/scenario_planning/lane_driving/behavior_planning/path_with_lane_id
      rviz_velocity_limit: /planning/scenario_planning/applied_velocity_limit
      control_command: /control/command/control_cmd
      gear_command: /control/command/gear_cmd
      turn_indicators_command: /control/command/turn_indicators_cmd
      hazard_lights_command: /control/command/hazard_lights_cmd
