/**:
  ros__parameters:
    lane_change:
      drivable_area_recovery:
        enabled: true
        duration: 10.0 # [s] persistent nearby boundary stop while an approved maneuver is stopped
        retry_interval: 1.0 # [s] bounded alternative search; no speed/RTC override
        message_timeout: 0.5 # [s] stale or interrupted feedback resets the wait
        stop_distance: 2.0 # [m] only a stop near ego triggers recovery
      tactical_selection:
        enable: true # shared local corridor ranking; no final-return path reservation
      # Explicit RTC force approval for a valid candidate after obstacle_stop persists.
      # false restores normal approval behavior; see docs/obstacle-stop-recovery.md.
      obstacle_stop_recovery:
        enabled: true
        module: lane_change_left
        duration: 5.0 # [s] ROS/simulation time
        stopped_velocity: 0.1 # [m/s] allows the observed residual crawl
        message_timeout: 0.5 # [s] missing obstacle_stop messages reset the timer
        stop_distance: 2.0 # [m] stop point at/behind ego or within this distance
        signal_queue_distance: 100.0 # [m] exclude queues before a stopping signal

      time_limit: 50.0 # [ms]
      backward_lane_length: 200.0
      backward_length_buffer_for_end_of_lane: 3.0 # [m]
      backward_length_buffer_for_blocking_object: 3.0 # [m]
      backward_length_from_intersection: 5.0 # [m]
      enable_stopped_vehicle_buffer: true
      enable_direct_multi_lane_change: true # combine mandatory changes only when sequential changes do not fit

      # turn signal
      min_length_for_turn_signal_activation: 10.0 # [m]

      # terminal path
      terminal_path:
        enable: true
        disable_near_goal: true
        stop_at_boundary: false

      # Local search when an obstacle limits preparation or an approved path is blocked.
      obstacle_aware:
        min_lane_changing_velocity: 1.0 # [m/s] attainable preparation speed floor
        stopped_replan_velocity: 1.5 # [m/s] ceiling after a stopped-pose replan

      # trajectory generation
      trajectory:
        multi_lane_prepare_duration: 1.0 # [s] Fixed preparation when crossing two or more lanes.
        # Simulator only: no lateral comfort caps; steering geometry/collision checks remain.
        enable_lateral_acceleration_limit: false
        enable_lateral_jerk_limit: false
        max_prepare_duration: 3.0
        min_prepare_duration: 0.25  # {OVERRIDE: allow sub-second preparation; braking remains reachable}
        lateral_jerk: 0.77 # {OVERRIDE: 70 percent of pre-half value; simulator comfort profile}
        min_longitudinal_acc: -5.0  # {OVERRIDE: bounded by the deployed longitudinal controller}
        max_longitudinal_acc: 0.77 # {OVERRIDE: 70 percent of pre-half value; simulator comfort profile}
        th_prepare_length_diff: 1.0
        th_lane_changing_length_diff: 1.0
        min_lane_changing_velocity: 1.5 # {OVERRIDE: allow a short low-speed prepare phase near a lane terminal}
        lon_acc_sampling_num: 5
        lat_acc_sampling_num: 3
        lane_changing_decel_factor: 0.5
        th_prepare_curvature: 0.03 # [/]
        # Geometric taper used when a target lane starts ahead at a split/expansion.
        target_lane_backward_overlap_length: 10.0 # [m]

      # delay lane change
      delay_lane_change:
        enable: true
        check_only_parked_vehicle: false
        min_road_shoulder_width: 0.5  # [m]
        th_parked_vehicle_shift_ratio: 0.6

      # trajectory generation near terminal using frenet planner
      frenet:
        enable: false # {OVERRIDE: path shifter produces a safety-checkable path near short VTD lane terminals}
        use_entire_remaining_distance: false
        th_yaw_diff: 10.0  # [deg]
        th_curvature_smoothing: 0.1 # [/]
        th_average_curvature: 0.020 # [/]

      # safety check
      safety_check:
        polygon_expansion_scale: 0.5 # Scale extra lateral and longitudinal RSS clearance.
        allow_loose_check_for_cancel: true
        enable_target_lane_bound_check: true
        stopped_object_velocity_threshold: 0.3          # [m/s] Object whose velocity is less than the threshold is treated as static object.
        prepare:                                        # RSS parameters used during the prepare phase, regardless of whether the ego is searching for a safe path, canceling, or transitioning to another state.
          expected_front_deceleration: -1.0             # [m/s2]
          expected_rear_deceleration: -1.0              # [m/s2]
          rear_vehicle_reaction_time: 1.0               # [s]
          rear_vehicle_safety_time_margin: 0.8          # [s]
          lateral_distance_max_threshold: 0.5           # [m]
          longitudinal_distance_min_threshold: 1.0      # [m]
          longitudinal_velocity_delta_time: 0.0         # [s]
          extended_polygon_policy: "along_path"         # [-] available options are `rectangle` or `along_path`
        execution:
          expected_front_deceleration: -1.0
          expected_rear_deceleration: -1.0
          rear_vehicle_reaction_time: 2.0
          rear_vehicle_safety_time_margin: 1.0
          lateral_distance_max_threshold: 2.0
          longitudinal_distance_min_threshold: 3.0
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"
        parked:
          expected_front_deceleration: -1.0
          expected_rear_deceleration: -2.0
          rear_vehicle_reaction_time: 1.0
          rear_vehicle_safety_time_margin: 0.8
          lateral_distance_max_threshold: 1.0
          longitudinal_distance_min_threshold: 3.0
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"
        cancel:
          expected_front_deceleration: -1.0
          expected_rear_deceleration: -2.0
          rear_vehicle_reaction_time: 1.5
          rear_vehicle_safety_time_margin: 0.8
          lateral_distance_max_threshold: 1.0
          longitudinal_distance_min_threshold: 2.5
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"
        stuck:
          expected_front_deceleration: -1.0
          expected_rear_deceleration: -1.0
          rear_vehicle_reaction_time: 2.0
          rear_vehicle_safety_time_margin: 1.0
          lateral_distance_max_threshold: 2.0
          longitudinal_distance_min_threshold: 3.0
          longitudinal_velocity_delta_time: 0.0
          extended_polygon_policy: "rectangle"

        # lane expansion for object filtering
        lane_expansion:
          left_offset: 1.0 # [m]
          right_offset: 1.0 # [m]

      # lateral acceleration map
      lateral_acceleration:
        velocity: [0.0, 4.0, 10.0]
        min_values: [0.6, 0.6, 0.6]
        max_values: [0.693, 0.693, 0.693] # {OVERRIDE: 70 percent of pre-half value; simulator comfort profile}

      # target object
      target_object:
        car: true
        truck: false
        bus: false
        trailer: false
        unknown: true
        bicycle: false
        motorcycle: false
        pedestrian: true

      # collision check
      collision_check:
        prediction_time_resolution: 0.5
        th_incoming_object_yaw: 2.3562 # [rad]
        yaw_diff_threshold: 3.1416 # [rad]
        check_current_lanes: false
        check_other_lanes: true # required to check intermediate lanes during a direct multi-lane change
        use_all_predicted_paths: false

      # lane change regulations
      regulation:
        crosswalk: true
        intersection: true
        traffic_light: true

      # ego vehicle stuck detection
      stuck_detection:
        velocity: 0.5 # [m/s]
        stop_time: 3.0 # [s]

      # lane change cancel
      cancel:
        enable_on_prepare_phase: true
        enable_on_lane_changing_phase: true
        delta_time: 1.0                     # [s]
        duration: 5.0                       # [s]
        max_lateral_jerk: 100.0             # [m/s3]
        overhang_tolerance: 0.0             # [m]
        unsafe_hysteresis_threshold: 5      # [/]
        deceleration_sampling_num: 1        # [/] Used to sample the approved lane change path, specifically for checking safety against leading objects.

      lane_change_finish_judge_buffer: 1.0      # [m] {OVERRIDE: finish split-lane changes sooner}
      finish_judge_lateral_threshold: 0.1        # [m]
      finish_judge_lateral_angle_deviation: 1.0 # [deg]

      # path miss detection
      path_miss:
        enable_path_miss_detection: true  # enable/disable path miss detection
        threshold_longitudinal: 1.0       # [m] - max longitudinal deviation from lc end allowed (fixed, no scaling)

        # path miss velocity scaling parameters
        # Lateral threshold will be dynamically scaled based on ego velocity using these interpolation points
        # At zero speed: stricter tolerance (to update lc path when ego is stopped)
        # At low speeds: higher tolerance (to allow ego to follow lc path)
        # At high speeds: stricter tolerance (to update lc path when ego is moving)
        velocity_points: [ 0.0, 0.1, 0.11, 2.77, 2.78, 20.0 ]   # [m/s] - velocity points for interpolation
        lateral_thresholds: [ 3.0, 3.0, 5.0,  5.0,  1.5,   0.8 ]     # corresponding lateral thresholds [m]

      # debug
      publish_debug_marker: true
