/**:
  ros__parameters:
    avoidance_by_lane_change:
      execute_object_longitudinal_margin: 7.0  # Minimum obstacle distance, not a look-ahead limit.
      max_execution_distance: 35.0  # [m] New approvals only; keep long-range lookup/candidates.
      execute_only_when_lane_change_finish_before_object: false
      max_lane_changing_length_scale: 0.8
      obstacle_velocity_limit_ratio: 0.6
      disable_lateral_acceleration_limit: true
      enable_direct_multi_lane_change: true
      empty_lane_check_forward_distance: 80.0
      empty_lane_check_backward_distance: 20.0

      route_priority:
        blockage_min_duration: 3.0       # [s] Original confirmation for objects without motion history.
        stopped_dynamic_min_duration: 7.0 # [s] Reclassify ONLY previously moving objects after a continuous stop.
        blockage_max_position_drift: 0.5 # [m] Motion resets blocker evidence.

      # avoidance is performed for the object type with true
      target_object:
        car:
          th_moving_speed: 1.0                         # [m/s]
          th_moving_time: 1.0                          # [s]
          max_expand_ratio: 0.0                        # [-]
          envelope_buffer_margin: 0.3                  # [m]
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        truck:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        bus:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        trailer:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        unknown:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.3                           # [m] Shared downstream floor also applies.
            hard_margin_for_parked_vehicle: 0.3        # [m]
        bicycle:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        motorcycle:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        pedestrian:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        lower_distance_for_polygon_expansion: 0.0      # [m]
        upper_distance_for_polygon_expansion: 1.0      # [m]

      # For target object filtering
      target_filtering:
        # avoidance target type
        target_type:
          car: true                                    # [-]
          truck: false                                  # [-]
          bus: false                                    # [-]
          trailer: false                                # [-]
          unknown: true                                # [-]
          bicycle: false                               # [-]
          motorcycle: false                            # [-]
          pedestrian: true                            # [-]
