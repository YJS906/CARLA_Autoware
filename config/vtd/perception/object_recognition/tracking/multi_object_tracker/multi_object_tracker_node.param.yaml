# VTD override of the Autoware 0.52.0 multi-object tracker configuration.
/**:
  ros__parameters:
    world_frame_id: map
    ego_frame_id: base_link

    publish_on_timer: true
    publish_rate: 10.0

    ego_source: tf
    delay_compensation: full

    consider_odometry_uncertainty: false

    tracker_configs:
      polygon_tracker:
        enable_velocity_estimation: true
        enable_motion_output:
          # Allow motion output for UNKNOWN and size-classified CAR/PEDESTRIAN.
          unknown:    true
          car:        true
          truck:      false
          bus:        false
          trailer:    false
          motorcycle: false
          bicycle:    false
          pedestrian: true
          animal:     false
          hazard:     false
      static_tracker:
        convert_polygon_to_bbox: false

    min_known_object_removal_iou: 0.1
    min_unknown_object_removal_iou: 0.001
    pruning_generalized_iou_threshold: 0.1
    pruning_distance_thresholds:
      unknown: 9.0
      car: 5.0
      truck: 9.0
      bus: 9.0
      trailer: 9.0
      motorcycle: 4.0
      bicycle: 3.0
      pedestrian: 2.0
      animal: 2.0
      hazard: 2.0

    publish_processing_time: true
    publish_processing_time_detail: false
    publish_tentative_objects: false
    publish_debug_markers: false
    diagnostics_warn_delay: 0.5
    diagnostics_error_delay: 1.0
    diagnostics_warn_extrapolation: 0.5
    diagnostics_error_extrapolation: 1.0
